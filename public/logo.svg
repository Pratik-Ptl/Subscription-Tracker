<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Stylized "S" path that doubles as a tracking line -->
  <path d="M 310 128
           C 220 128, 152 164, 152 218
           C 152 272, 220 280, 280 292
           C 340 304, 360 328, 360 358
           C 360 398, 300 420, 210 400"
        stroke="white" stroke-width="52" stroke-linecap="round" fill="none" opacity="0.95"/>
  <!-- Small tracking dot at the end of the S path -->
  <circle cx="210" cy="400" r="24" fill="white" opacity="0.95"/>
  <!-- Subtle inner dot for depth -->
  <circle cx="210" cy="400" r="12" fill="url(#bg)"/>
</svg>
